<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Sumit - DevOps Engineer (Fresher)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="0.55" stop-color="#140f35"/>
      <stop offset="1" stop-color="#062a3b"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="hex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="340" rx="24"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <style>
      .sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
      .mono{font-family:SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}
      @keyframes pulse{0%,100%{opacity:1;r:5}50%{opacity:.35;r:8}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
      @keyframes dash{to{stroke-dashoffset:-60}}
      .dot{animation:pulse 1.8s ease-in-out infinite}
      .fl{animation:float 5s ease-in-out infinite}
      .flow{stroke-dasharray:6 6;animation:dash 1.6s linear infinite}
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <circle cx="180" cy="60" r="220" fill="url(#glowA)">
      <animate attributeName="cx" values="180;260;180" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="300" r="240" fill="url(#glowB)">
      <animate attributeName="cx" values="1040;960;1040" dur="11s" repeatCount="indefinite"/>
    </circle>
    <rect width="1200" height="150" fill="url(#gloss)" opacity="0.5"/>

    <!-- monogram -->
    <g class="fl">
      <polygon points="118,62 168,90 168,148 118,176 68,148 68,90" fill="url(#hex)"/>
      <polygon points="118,62 168,90 168,148 118,176 68,148 68,90" fill="url(#gloss)"/>
      <polygon points="118,62 168,90 168,148 118,176 68,148 68,90" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2"/>
      <text x="118" y="136" text-anchor="middle" class="sans" font-size="56" font-weight="800" fill="#fff">S</text>
    </g>

    <!-- status pill -->
    <g transform="translate(210,64)">
      <rect width="262" height="34" rx="17" fill="url(#chip)" stroke="#34d399" stroke-opacity="0.55"/>
      <circle class="dot" cx="20" cy="17" r="5" fill="#34d399"/>
      <text x="36" y="22" class="mono" font-size="13" font-weight="700" fill="#a7f3d0" letter-spacing="1.2">OPEN TO WORK · FRESHER</text>
    </g>

    <!-- name + role -->
    <text x="210" y="158" class="sans" font-size="68" font-weight="800" fill="url(#title)">Hi, I'm Sumit</text>
    <text x="212" y="198" class="sans" font-size="27" font-weight="600" fill="#e2e8f0">DevOps Engineer</text>
    <text x="212" y="228" class="mono" font-size="16" fill="#94a3b8">Docker  •  Kubernetes  •  Terraform  •  CI/CD  •  AWS</text>

    <!-- pipeline chips -->
    <g transform="translate(60,262)" class="mono" font-size="14" font-weight="700" fill="#e2e8f0">
      <g><rect width="128" height="40" rx="12" fill="url(#chip)" stroke="#fff" stroke-opacity="0.22"/><text x="64" y="26" text-anchor="middle">01 commit</text></g>
      <g transform="translate(160,0)"><rect width="128" height="40" rx="12" fill="url(#chip)" stroke="#fff" stroke-opacity="0.22"/><text x="64" y="26" text-anchor="middle">02 build</text></g>
      <g transform="translate(320,0)"><rect width="128" height="40" rx="12" fill="url(#chip)" stroke="#fff" stroke-opacity="0.22"/><text x="64" y="26" text-anchor="middle">03 scan</text></g>
      <g transform="translate(480,0)"><rect width="128" height="40" rx="12" fill="url(#chip)" stroke="#fff" stroke-opacity="0.22"/><text x="64" y="26" text-anchor="middle">04 package</text></g>
      <g transform="translate(640,0)"><rect width="128" height="40" rx="12" fill="url(#chip)" stroke="#fff" stroke-opacity="0.22"/><text x="64" y="26" text-anchor="middle">05 deploy</text></g>
      <g transform="translate(800,0)"><rect width="140" height="40" rx="12" fill="url(#chip)" stroke="#fff" stroke-opacity="0.22"/><text x="70" y="26" text-anchor="middle">06 monitor</text></g>
      <g stroke="#22d3ee" stroke-width="2" fill="none" class="flow">
        <path d="M128 20H160"/><path d="M288 20H320"/><path d="M448 20H480"/><path d="M608 20H640"/><path d="M768 20H800"/>
      </g>
    </g>

    <!-- right terminal card -->
    <g transform="translate(830,52)">
      <rect width="310" height="170" rx="16" fill="#0b1220" fill-opacity="0.72" stroke="#fff" stroke-opacity="0.18"/>
      <rect width="310" height="170" rx="16" fill="url(#gloss)" opacity="0.5"/>
      <circle cx="22" cy="22" r="6" fill="#ff5f56"/><circle cx="42" cy="22" r="6" fill="#ffbd2e"/><circle cx="62" cy="22" r="6" fill="#27c93f"/>
      <g class="mono" font-size="13">
        <text x="20" y="62" fill="#94a3b8">$ <tspan fill="#67e8f9">terraform</tspan> <tspan fill="#e2e8f0">apply</tspan></text>
        <text x="20" y="88" fill="#94a3b8">$ <tspan fill="#c4b5fd">kubectl</tspan> <tspan fill="#e2e8f0">get pods</tspan></text>
        <text x="20" y="114" fill="#94a3b8">$ <tspan fill="#fcd34d">docker</tspan> <tspan fill="#e2e8f0">compose up -d</tspan></text>
        <text x="20" y="144" fill="#34d399">> pipeline passed</text>
      </g>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="338" rx="23" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>
</svg>
